- name: configuring shipping server
  hosts: shipping
  become: yes
  tasks:
    - name: enable maven 3.9
      command: dnf module enable maven:3.9 -y

    - name: install maven and java25
      dnf:
        name: 
        - maven
        - java-25-openjdk-devel
        - maven-openjdk25 # installing this so that we no need to set JAVA_HOME again
        state: present

    # - name: find java25 path
    #   shell: readlink -f $(/usr/lib/jvm/java-25-openjdk*/bin/java | head -1 )
    #   register: java25


    # - name: print the output
    #   debug: 
    #     msg: "{{ java25 .stdout }}"

    # - name: make java25 as defailt
    #   command: alternatives --set java {{ java25.stdout }}

    - name: create roboshop system user
      user: 
        name: roboshop
        create_home: false
        home: /app
        system: true
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: remove existing app directory
      file: 
        path: /app
        state: absent

    - name: remove shipping.zip
      file: 
        path: /tmp/shipping.zip
        state: absent    

    - name: create app directory
      file: 
        path: /app
        state: directory


    - name: download shipping application
      get_url: 
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
        dest: /tmp/shipping.zip

    - name: unzip shipping

      unarchive:
          src: /tmp/shipping.zip
          dest: /app
          remote_src: yes

    - name: install dependencies
      command: mvn clean package
      args:
          chdir: /app
        # environment:
        #   MAVEN_OPTS: "-Djdk.tls.nameGroups=\"secp256r1, secp384r1, ffdhe2048\""


