- name: create ec2 instances and r53 records
  hosts: local
  connection: local
  vars:
    instances: ["Mongodb", "Redis", "MySQL", "RabbitMQ"]
    instance_action: create
    domain_name: shariffdevops.online
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups:
      - roboshop-common
      - "Roboshop-{{ item }}"
      region: us-east-1
    loop: "{{ instances }}"
    when: instance_action == "create"
    register: ec2_output

  # - name: print ec2 creation output
  #   debug: 
  #     msg: "{{ ec2_output }}"

  - name: create r53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}" #mongodb.shariffdevops.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: instance_action == "create"
